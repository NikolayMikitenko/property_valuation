[project]
name = "beliscan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.0.1",
    "bs4>=0.0.2",
    "deepeval>=3.9.8",
    "fastapi>=0.136.1",
    "fastmcp>=3.2.4",
    "langchain>=1.2.15",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.1.15",
    "langfuse>=4.5.1",
    "langgraph>=1.1.8",
    "minio>=7.2.20",
    "playwright>=1.58.0",
    "pymongo>=4.16.0",
    "starlette>=1.0.0",
    "uvicorn>=0.44.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/screenshot_mcp", "src/proof_agent", "src/mongo_cache_mcp", "src/dom_ria_mcp", "src/research_agent", "src/supervisor_agent", "src/mongo_store_mcp", "src/object_move_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
